[project]
name = "sst"
dynamic = ["version"]
description = "Rflow: dictation for Windows. Hold Ctrl+Win, speak, and the text is typed; speech is recognised on the laptop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "sherpa-onnx==1.13.8",
    # Ships the matching onnxruntime.dll. It is not pulled in automatically, and without it
    # Windows loads its own older System32\onnxruntime.dll and model loading fails.
    "sherpa-onnx-core==1.13.8",
    "sounddevice>=0.5",
    # The tray app: tray icon, recording pill, settings and history windows (Qt, LGPL, linked dynamically).
    "pyside6-essentials>=6.8",
    # Whisper large-v3 turbo on this computer (CTranslate2), the second speech model: on the owner's recordings it was
    # more accurate than sherpa-onnx's Whisper. Its onnxruntime dependency (only for its optional VAD) is never imported
    # and is left out of the installer, so sherpa-onnx keeps the one onnxruntime.dll it needs.
    "faster-whisper>=1.2,<2",
    "websockets>=17",
]

[project.scripts]
sst = "sst.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17.0"]
# Only for building the Windows installer (build_installer.cmd); not needed to run sst.
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "sst/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sst"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# Explicit, so a newer ruff with different defaults does not break CI.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
