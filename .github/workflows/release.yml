name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # build the installer from any branch as a downloadable artifact, without publishing

permissions:
  contents: read

jobs:
  installer:
    name: Build installer
    runs-on: windows-latest
    permissions:
      contents: write  # publish the GitHub Release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Check that the tag matches sst.__version__
        if: github.ref_type == 'tag'
        run: |
          version=$(uv run --locked python -c "import sst; print(sst.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match sst.__version__ ($version). Update sst/__init__.py first."
            exit 1
          fi
      - name: Cache the Parakeet model
        uses: actions/cache@v6
        with:
          path: models
          key: model-${{ hashFiles('scripts/download_model.py') }}
      - name: Download the model (skipped when cached)
        run: uv run --locked python scripts/download_model.py parakeet
      - name: Install Inno Setup
        run: |
          if ! ls "/c/Program Files (x86)"/Inno\ Setup*/ISCC.exe >/dev/null 2>&1; then
            choco install innosetup --no-progress -y
          fi
      - name: Build the installer
        run: uv run --locked --group build python scripts/build_installer.py
      - name: Name it for the stable download link, with its checksum
        # releases/latest/download/Rflow-Setup.exe always gives the newest version (the website links there), and the
        # app's updater checks every download against Rflow-Setup.exe.sha256 before running it.
        run: |
          mkdir -p dist/release
          cp dist/Rflow-Setup-*.exe dist/release/Rflow-Setup.exe
          cd dist/release && sha256sum Rflow-Setup.exe > Rflow-Setup.exe.sha256 && cat Rflow-Setup.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Rflow-Setup
          path: dist/release/*
          compression-level: 0  # already compressed
          retention-days: 14
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/Rflow-Setup.exe dist/release/Rflow-Setup.exe.sha256 \
            --title "Rflow $GITHUB_REF_NAME" --generate-notes
